<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Receipts — Buffer approvals</title>
  <meta name="description" content="Pull Buffer drafts into a no-login client approval room and keep the receipt.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0d0f0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@500;600;700;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="nudge-root"></div>
  <div id="modal-root"></div>
  <div id="app"></div>

  <!-- Netlify's deploy scanner uses this blueprint for the JS-rendered feedback form. -->
  <form name="beta-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="beta-feedback">
    <input name="bot-field">
    <input name="name">
    <input name="email">
    <select name="what_happened"><option>Other</option></select>
    <textarea name="message"></textarea>
    <input name="creator_page">
    <input name="timestamp">
    <input name="user_agent">
    <input name="creator_id">
    <input name="frictionless_beta">
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/demo-data.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
